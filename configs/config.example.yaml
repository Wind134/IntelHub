server:
  listen_addr: "127.0.0.1:8787"
  db_path: "~/.hermes/intel/intel_hub.db"
  backup_dir: "~/.hermes/intel/backups"
  backup_remote: "backup-server:~/backups/intel-hub/"
  # api_token 建议通过环境变量 INTEL_API_TOKEN 注入，切勿明文提交到仓库
  api_token: ""
  public_url: "https://intel.example.com"

budget:
  monthly_cap_usd: 2.80
  twitter_cap_usd: 2.50

llm:
  # 默认复用主服务器 ~/.hermes/.env 中的 OPENCODE_GO_API_KEY
  base_url: "https://opencode.ai/zen/go/v1"
  fast_model: "deepseek-v4.1-flash"
  fallback_model: "qwen3.8-flash"
  strong_model: "deepseek-v4-pro"
  timeout_sec: 25

search:
  # 通过环境变量 BRAVE_API_KEY / TAVILY_API_KEY 注入（免费额度 $0）
  brave_api_key: ""
  tavily_api_key: ""

twitter_api:
  # 在 ~/.hermes/intel/.env 设置 TWITTERAPI_IO_KEY 后自动启用
  enabled: false
  active_interval_sec: 120
  quiet_interval_sec: 300
  accounts:
    - "OpenAI"
    - "AnthropicAI"
    - "GoogleDeepMind"
    - "deepseek_ai"
    - "Alibaba_Qwen"
    - "sama"
    - "karpathy"
    - "elonmusk"
    - "WalterBloomberg"
    - "DeItaone"
    - "ReutersTech"
    - "CNBCnow"

finnhub:
  # 在 ~/.hermes/intel/.env 设置 FINNHUB_API_KEY 后自动启用（免费额度 $0）
  enabled: false
  symbols:
    - "NVDA"
    - "AAPL"
    - "MSFT"
    - "GOOGL"
    - "META"
    - "AMZN"
    - "TSLA"
    - "TSM"
    - "AVGO"
    - "AMD"
    - "ASML"
    - "ARM"
    - "PLTR"
    - "QQQ"
    - "SPY"
    - "SOXX"
  etf_symbols: ["QQQ", "SPY", "SOXX"]
  window_minutes: 5
  stock_threshold_pct: 3.5
  etf_threshold_pct: 1.5
  news_interval_sec: 120

filters:
  min_text_length: 15
  simhash_threshold: 3
  cooldown_minutes: 30
  exclude_keywords:
    - "生活"
    - "生活方式"
    - "健康"
    - "养生"
    - "美食"
    - "食谱"
    - "旅行"
    - "旅游"
    - "穿搭"
    - "时尚"
    - "美容"
    - "护肤"
    - "减肥"
    - "健身"
    - "育儿"
    - "宠物"
    - "星座"
    - "情感"
    - "家居"
    - "综艺"
    - "明星"
    - "娱乐"
    - "八卦"
    - "电影"
    - "电视剧"
    - "音乐"
    - "体育"
    - "足球"
    - "篮球"
    - "抽奖"
    - "广告"
    - "早报汇总"
    - "南方财经"
    - "南方财经全媒体集团"
    - "21财经"
    - "证券之星"
    - "lifestyle"
    - "wellness"
    - "recipe"
    - "travel"
    - "fashion"
    - "celebrity"
    - "entertainment"
    - "sports"

notify:
  feishu_min_score: 8
  weixin_p1_mirror: false

feeds:
  # === 高频免费实时快讯与官方状态页 ===
  - name: "wscn-global"
    label: "华尔街见闻7x24"
    type: "wscn_lives"
    category: "finance"
    url: "https://api-one-wscn.awtmt.com/apiv1/content/lives?channel=global-channel&limit=25"
    interval_sec: 60
    enabled: true

  - name: "openai-status"
    label: "OpenAI Status"
    type: "status_atom"
    category: "ai"
    url: "https://status.openai.com/history.atom"
    interval_sec: 90
    enabled: true
    bypass_rules: true

  - name: "anthropic-status"
